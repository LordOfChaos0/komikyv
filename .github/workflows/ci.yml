# ============================================================
# «Коми кыв» — CI: проверки качества кода
#
# Что делает: ESLint → TypeScript (tsc --noEmit) →
# production-сборка (next build, output: standalone).
#
# Когда запускается:
#   - каждый pull_request в main / develop;
#   - каждый push в main / develop.
# Успешный CI на main автоматически запускает Deploy (deploy.yml).
#
# Особенности проекта:
#   - зависимости ставит bun (lock-файл — bun.lock), поэтому
#     НЕ используется npm ci / package-lock.json;
#   - сборка выполняется под Node.js (как на VM, DEPLOY.md §5);
#   - демо-база SQLite лежит в репозитории (db/custom.db) и нужна
#     для пререндера страниц во время next build;
#   - src/lib/auth.ts требует JWT_SECRET при NODE_ENV=production.
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Повторный push в тот же PR/ветку отменяет предыдущую проверку
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Линт + типы + сборка
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Абсолютный путь к демо-базе (см. DEPLOY.md §10: относительные
      # пути в DATABASE_URL — частая причина ошибок Prisma)
      DATABASE_URL: file:${{ github.workspace }}/db/custom.db
      # Заглушка для next build: приложение стартует в NODE_ENV=production
      JWT_SECRET: ci-dummy-jwt-secret-not-for-production-0123456789abcdef
      APP_URL: http://localhost:3000
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Bun (как в разработке, для bun.lock)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Установить Node.js (для сборки)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Установить зависимости (bun install --frozen-lockfile)
        run: bun install --frozen-lockfile

      - name: Сгенерировать Prisma-клиент
        run: npx prisma generate

      - name: ESLint
        run: npm run lint

      - name: Проверка типов (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Production-сборка (next build)
        run: npm run build
